site_name: maneuver-detect
site_description: Open dataset, models, and benchmark for detecting orbital maneuvers from public TLE history.
site_url: https://astro-tools.github.io/maneuver-detect/
repo_url: https://github.com/astro-tools/maneuver-detect
repo_name: astro-tools/maneuver-detect
edit_uri: edit/main/docs/

# The design/ tree (frozen decision records and the prerequisite-spike write-ups) lives in the
# repo for contributors, not on the public docs site.
exclude_docs: |
  design/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Dataset and labels: dataset.md
  - Benchmark protocol: benchmark.md
  - Output schema and Δv inversion: schema.md
  - Design decisions: decisions.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            docstring_style: google
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/astro-tools/maneuver-detect
